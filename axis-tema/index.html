<style>
  :root {
    --bg: #0B0C0E; --panel: #FFFFFF; --ink: #101114; --muted: #6B6F76; --line: #E6E7EA;
    --glass: rgba(14, 15, 18, 0.42); --glass-line: rgba(255, 255, 255, 0.14);
    --white: #FFFFFF; --green: #22A45D;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: 248px 1fr; overflow: hidden; }

  /* ---------- sidopanel ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 26px 18px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; padding: 0 8px 22px; border-bottom: 1px solid var(--line); }
  .brand svg { width: 22px; height: 22px; }
  .sec { font-size: 10.5px; letter-spacing: 0.14em; color: #9A9EA5; font-weight: 600; padding: 22px 10px 8px; }
  nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: #3A3D43; text-decoration: none; font-size: 14px; }
  nav a svg { width: 17px; height: 17px; stroke: #6B6F76; fill: none; stroke-width: 1.6; }
  nav a .count { margin-left: auto; font-size: 12px; color: #9A9EA5; }
  nav a.on { background: #F1F2F4; color: var(--ink); font-weight: 600; } nav a.on svg { stroke: var(--ink); }
  .user { margin-top: auto; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .user .who { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .user .av { width: 34px; height: 34px; border-radius: 50%; background: #F1F2F4; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .user .name { font-size: 13.5px; font-weight: 600; } .user .co { font-size: 12px; color: var(--muted); }
  .user button { width: 100%; padding: 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font: inherit; font-size: 13px; color: #3A3D43; }

  /* ---------- scrollyta ---------- */
  main { position: relative; height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }
  .tema { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 520px; }
  .media { position: absolute; inset: 0; background: #14161A; overflow: hidden; }
  .media video, .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.07); transition: opacity 1.1s var(--ease), transform 7s var(--ease); }
  .tema.on .media video.ready, .tema.on .media img.ready { opacity: 1; transform: scale(1); }
  .media img.ready { animation: none; }
  .tema.on .media img.ready { animation: drift 24s linear infinite alternate; }
  @keyframes drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
  .media::after { content: ""; position: absolute; inset: 0; background:

      linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); pointer-events: none; }

  .titel { position: relative; align-self: end; padding: 0 0 56px 64px; color: var(--white); z-index: 2; }
  .titel .kicker { font-size: 11px; letter-spacing: 0.16em; font-weight: 600; opacity: 0; transform: translateY(14px); transition: all 0.9s var(--ease) 0.15s; text-transform: uppercase; color: rgba(255,255,255,0.75); }
  .titel h1 { margin: 6px 0 8px; font-size: clamp(48px, 7vw, 96px); line-height: 0.98; letter-spacing: -0.035em; font-weight: 600; opacity: 0; transform: translateY(28px); transition: all 1s var(--ease) 0.05s; }
  .titel p { margin: 0; max-width: 40ch; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.82); opacity: 0; transform: translateY(18px); transition: all 0.9s var(--ease) 0.25s; }
  .titel .nu { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); font-size: 12.5px; font-weight: 600; opacity: 0; transform: translateY(12px); transition: all 0.9s var(--ease) 0.35s; backdrop-filter: blur(8px); }
  .titel .nu i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(34,164,93,0.3); }
  .tema.on .titel .kicker, .tema.on .titel h1, .tema.on .titel p, .tema.on .titel .nu { opacity: 1; transform: none; }
  .titel .nu { display: none; } .tema.vald .titel .nu { display: inline-flex; }

  .kort { position: relative; z-index: 2; align-self: center; margin: 0 56px 0 24px; padding: 26px 26px 22px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); color: var(--white); box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6); opacity: 0; transform: translateY(26px); transition: all 1s var(--ease) 0.2s; }
  .tema.on .kort { opacity: 1; transform: none; }
  .kort .lbl { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,0.62); margin: 0 0 8px; }

  .kort .desc { margin: 4px 0 18px; font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }

  .mallar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .mall { position: relative; border-radius: 10px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.18); cursor: pointer; background: #222; aspect-ratio: 16 / 9; transition: border-color 0.3s, transform 0.4s var(--ease); }
  .mall img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease); }
  .mall:hover img { transform: scale(1.04); }
  .mall .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; font-size: 12.5px; font-weight: 600; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.65)); display: flex; gap: 6px; align-items: center; }
  .mall .cap svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.3s; }
  .mall.on { border-color: var(--white); } .mall.on .cap svg { opacity: 1; }
  .mall .form { position: absolute; top: 8px; left: 8px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); }

  .toner { display: flex; gap: 8px; margin-bottom: 18px; }

  .ton i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .ton.on { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.55); }

  /* mejlförhandsvisning */
  .fv { border-radius: 12px; overflow: hidden; background: #FAFAF6; color: var(--ink); box-shadow: 0 14px 40px -20px rgba(0,0,0,0.7); margin-bottom: 18px; transition: transform 0.5s var(--ease); }
  .fv .hero { position: relative; height: 128px; background: #C9C4B8; overflow: hidden; }
  .fv .hero img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.4s; }
  .fv .hero .av { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); width: 38px; height: 38px; border-radius: 50%; border: 3px solid #FAFAF6; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }

  .fv .hero.form-kuvert img { clip-path: path('M0 0H360V88L180 128L0 88Z'); }
  .fv .hero.form-oval img { -webkit-mask-image: radial-gradient(ellipse 62% 90% at 50% 40%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 62% 90% at 50% 40%, #000 55%, transparent 100%); }
  .fv .hero.form-snett img { clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .fv .hero.form-biljett img { -webkit-mask: radial-gradient(circle at 0 108px, transparent 12px, #000 12.5px), radial-gradient(circle at 100% 108px, transparent 12px, #000 12.5px); -webkit-mask-composite: source-in; mask: radial-gradient(circle at 0 108px, transparent 12px, #000 12.5px), radial-gradient(circle at 100% 108px, transparent 12px, #000 12.5px); mask-composite: intersect; }

  .test { display: flex; gap: 8px; margin-bottom: 14px; }

  .btn { padding: 10px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.3s; }

  .actions { display: flex; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); padding: 10px 16px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.4s var(--ease); z-index: 20; pointer-events: none; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }

  /* ---------- räls ---------- */
  .rals { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 6px; }

  .rals a span { position: absolute; right: 30px; top: 50%; transform: translate(6px, -50%); white-space: nowrap; font-size: 12px; font-weight: 500; color: #fff; opacity: 0; transition: all 0.3s var(--ease); pointer-events: none; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); }

  @keyframes hjul { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }

  @media (max-width: 1100px) {
    body { grid-template-columns: 1fr; } aside { display: none; } .topp { left: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } main { scroll-behavior: auto; } }
</style>

/* Pexels sparar filerna med upplösning och bildfrekvens i namnet. Vi provar de vanligaste. */
const VARIANTER = ['uhd_2560_1440_30fps', 'uhd_2560_1440_25fps', 'uhd_2560_1440_24fps', 'hd_1920_1080_30fps', 'hd_1920_1080_25fps', 'hd_1920_1080_24fps', 'uhd_3840_2160_30fps', 'uhd_3840_2160_25fps', 'hd_1280_720_30fps', 'hd_1280_720_25fps'];
const U = (id, w = 1600, h = 900) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&h=${h}&q=80`;
const formNamn = { fade: 'Fade', u: 'U-form', bage: 'Båge', valv: 'Valv', vag: 'Våg', skold: 'Sköld', kuvert: 'Kuvert', oval: 'Spotlight', snett: 'Snedsnitt', biljett: 'Biljett', kullar: 'Kullar' };

const main = document.getElementById('main');
const rals = document.getElementById('rals');
const state = { vald: null, mall: {}, ton: {} };

TEMAN.forEach((t, i) => {
  state.mall[t.id] = 0; state.ton[t.id] = 0;
  const sec = document.createElement('section');
  sec.className = 'tema'; sec.id = t.id; sec.dataset.i = i;
  const kallor = (t.video ? [t.video] : t.pexels.flatMap(p => VARIANTER.map(v => `https://videos.pexels.com/video-files/${p}/${p}-${v}.mp4`)))
    .map(src => `<source src="${src}" type="video/mp4">`).join('');
  sec.innerHTML = `
    <div class="media">
      <video muted loop playsinline preload="none" poster="${U(t.bild)}">${kallor}</video>
      <img alt="" loading="lazy" src="${U(t.bild)}">
    </div>
    <div class="titel">
      <div class="kicker">${t.kicker}</div>
      <h1>${t.namn}</h1>
      <p>${t.desc}</p>
      <span class="nu"><i></i>Används nu</span>
    </div>
    <div class="kort">
      <p class="lbl">Mall för alla medarbetare</p>
      <h2>${t.namn}</h2>
      <p class="desc">${t.desc} Det du väljer här går ut i varje svar från kundservice.</p>
      <p class="lbl">Mall i mejlet</p>
      <div class="mallar">${t.mallar.map((m, k) => `
        <div class="mall ${k === 0 ? 'on' : ''}" data-k="${k}"><img src="${U(m.bild, 640, 360)}" alt=""><span class="form">${formNamn[m.form]}</span>
          <div class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>${m.namn}</div></div>`).join('')}
      </div>
      <p class="lbl">Ton</p>
      <div class="toner">${t.toner.map((x, k) => `<span class="ton ${k === 0 ? 'on' : ''}" data-k="${k}"><i style="background:${x[1]}"></i>${x[0]}</span>`).join('')}</div>
      <p class="lbl">Så blir mejlet</p>
      <div class="fv">
        <div class="hero form-${t.mallar[0].form}"><img src="${U(t.mallar[0].bild, 720, 260)}" alt=""><div class="av" style="background:${t.accent}">${t.butik[0]}</div></div>
        <div class="body">
          <div class="avs"><span><b>Ida Norén</b> &nbsp;${t.butik} kundservice</span><span>26 september · D-2216</span></div>
          <p class="hej" style="color:${t.accent}">Hej Sara,</p>
          <p class="txt">${t.svar}</p>
          <div class="prod"><span><b>${t.prod[0]}</b>${t.prod[1]}</span><span class="pris" style="color:${t.accent}">${t.prod[2]}</span></div>
        </div>
      </div>
      <p class="lbl">Prova i din egen inkorg</p>
      <div class="test"><input type="email" id="mail-${t.id}" placeholder="namn@företag.se"><button class="btn" data-act="test">Skicka testmejl</button></div>
      <div class="actions"><button class="btn prim" data-act="valj">Använd för alla</button><button class="btn" data-act="stang">Stäng</button></div>
    </div>`;
  main.appendChild(sec);

  const a = document.createElement('a');
  a.href = '#' + t.id; a.innerHTML = `<i></i><span>${t.namn}</span>`;
  a.addEventListener('click', e => { e.preventDefault(); sec.scrollIntoView({ behavior: 'smooth' }); });
  rals.appendChild(a);

  /* video: markera när den kan spelas, fall tillbaka på bilden om alla källor misslyckas */
  const v = sec.querySelector('video'), img = sec.querySelector('img');
  let videoOk = false;
  v.addEventListener('canplay', () => { videoOk = true; v.classList.add('ready'); img.classList.remove('ready'); }, { once: true });
  v.addEventListener('error', () => { if (!videoOk) { img.classList.add('ready'); v.remove(); } }, true);
  img.addEventListener('load', () => { if (!videoOk) img.classList.add('ready'); });
  if (img.complete && img.naturalWidth) img.classList.add('ready');

  /* val i kortet */
  sec.querySelectorAll('.mall').forEach(el => el.addEventListener('click', () => {
    const k = +el.dataset.k; state.mall[t.id] = k;
    sec.querySelectorAll('.mall').forEach(x => x.classList.toggle('on', x === el));
    const hero = sec.querySelector('.fv .hero'), hi = hero.querySelector('img');
    hero.className = 'hero form-' + t.mallar[k].form;
    hi.style.opacity = 0; setTimeout(() => { hi.src = U(t.mallar[k].bild, 720, 260); hi.onload = () => hi.style.opacity = 1; }, 200);
  }));
  sec.querySelectorAll('.ton').forEach(el => el.addEventListener('click', () => {
    const k = +el.dataset.k; state.ton[t.id] = k;
    sec.querySelectorAll('.ton').forEach(x => x.classList.toggle('on', x === el));
    const c = t.toner[k][1];
    sec.querySelector('.fv .hej').style.color = c; sec.querySelector('.fv .pris').style.color = c; sec.querySelector('.fv .av').style.background = c;
  }));
  sec.querySelector('[data-act="valj"]').addEventListener('click', () => {
    state.vald = t.id;
    document.querySelectorAll('.tema').forEach(x => x.classList.toggle('vald', x.id === t.id));
    toast(`${t.namn} används nu för alla medarbetare`);
  });
  sec.querySelector('[data-act="test"]').addEventListener('click', () => {
    const inp = sec.querySelector('input'); if (!inp.validity.valid || !inp.value) { inp.focus(); return; }
    toast(`Testmejl med ${t.namn} · ${t.mallar[state.mall[t.id]].namn} skickas till ${inp.value}`);
  });
  sec.querySelector('[data-act="stang"]').addEventListener('click', () => { const n = TEMAN[(i + 1) % TEMAN.length]; document.getElementById(n.id).scrollIntoView({ behavior: 'smooth' }); });
});

/* aktiv panel: spela bara den som syns och förbered nästa */
const alla = [...document.querySelectorAll('.tema')];
const hint = document.getElementById('hint');
let aktiv = -1;
function aktivera(i) {
  if (i === aktiv) return; aktiv = i;
  alla.forEach((s, k) => {
    s.classList.toggle('on', k === i);
    const v = s.querySelector('video');
    if (!v) return;
    if (k === i || k === i + 1) { if (v.preload === 'none') v.preload = 'auto', v.load(); }
    if (k === i) v.play().catch(() => {}); else v.pause();
  });
  rals.querySelectorAll('a').forEach((a, k) => a.classList.toggle('on', k === i));
  document.getElementById('topp-namn').textContent = TEMAN[i].namn;
  document.getElementById('topp-nr').textContent = String(i + 1).padStart(2, '0');
  hint.classList.toggle('dold', i > 0);
  if (i > 0) hint.style.display = 'none';
}
const io = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > 0.55) aktivera(+e.target.dataset.i); });
}, { root: main, threshold: [0.55] });
alla.forEach(s => io.observe(s));
aktivera(0);

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); alla[Math.min(aktiv + 1, alla.length - 1)].scrollIntoView({ behavior: 'smooth' }); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); alla[Math.max(aktiv - 1, 0)].scrollIntoView({ behavior: 'smooth' }); }
});

let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
</script>
</body>
</html>
