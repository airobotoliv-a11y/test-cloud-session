<style>
  :root {
    --bg: #0B0C0E; --panel: #FFFFFF; --ink: #101114; --muted: #6B6F76; --line: #E6E7EA;
    --white: #FFFFFF; --green: #22A45D; --ease: cubic-bezier(0.22, 1, 0.36, 1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: 248px 1fr; overflow: hidden; }

  /* ---------- sidopanel ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 26px 18px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; padding: 0 8px 22px; border-bottom: 1px solid var(--line); }
  .brand svg { width: 22px; height: 22px; }
  .sec { font-size: 10.5px; letter-spacing: 0.14em; color: #9A9EA5; font-weight: 600; padding: 22px 10px 8px; }
  nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: #3A3D43; text-decoration: none; font-size: 14px; }
  nav a svg { width: 17px; height: 17px; stroke: #6B6F76; fill: none; stroke-width: 1.6; }
  nav a .count { margin-left: auto; font-size: 12px; color: #9A9EA5; }
  nav a.on { background: #F1F2F4; color: var(--ink); font-weight: 600; } nav a.on svg { stroke: var(--ink); }
  .user { margin-top: auto; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .user .who { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .user .av { width: 34px; height: 34px; border-radius: 50%; background: #F1F2F4; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .user .name { font-size: 13.5px; font-weight: 600; } .user .co { font-size: 12px; color: var(--muted); }
  .user button { width: 100%; padding: 8px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font: inherit; font-size: 13px; color: #3A3D43; }

  /* ---------- skärmar (fyra fält per skärm) ---------- */
  main { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }
  .skarm { height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; display: flex; background: #000; }
  .falt { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; cursor: pointer; transition: flex 0.9s var(--ease); border-right: 1px solid rgba(255,255,255,0.06); }
  .falt:last-child { border-right: 0; }
  .skarm:not(.oppen) .falt:hover { flex: 1.18 1 0; }
  .skarm.oppen .falt { flex: 0 0 96px; }
  .skarm.oppen .falt.on { flex: 1 1 0; cursor: default; }

  .falt video, .falt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.08); transition: opacity 1.2s var(--ease), transform 8s var(--ease); }
  .falt .ready { opacity: 1; transform: scale(1); }
  .falt img.ready.drift { animation: drift 30s linear infinite alternate; }
  @keyframes drift { from { transform: scale(1.04) translate(0,0); } to { transform: scale(1.12) translate(-1.5%,-1%); } }
  .falt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.62) 100%); pointer-events: none; transition: background 0.9s; }
  .skarm.oppen .falt:not(.on)::after { background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.75) 100%); }
  .skarm.oppen .falt.on::after { background: linear-gradient(90deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.55) 100%), linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%); }

  .etikett { position: absolute; left: 28px; right: 24px; bottom: 34px; color: var(--white); z-index: 2; transition: all 0.9s var(--ease); }
  .etikett h2 { margin: 0; font-size: clamp(30px, 3.2vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .etikett p { margin: 10px 0 0; font-size: 14px; color: rgba(255,255,255,0.82); max-width: 32ch; transition: opacity 0.5s; }
  .etikett .nu { display: none; align-items: center; gap: 7px; margin-top: 12px; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); font-size: 12px; font-weight: 600; backdrop-filter: blur(8px); }
  .etikett .nu i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(34,164,93,0.3); }
  .falt.vald .etikett .nu { display: inline-flex; }
  .skarm.oppen .falt:not(.on) .etikett { left: 14px; right: 8px; bottom: 30px; }
  .skarm.oppen .falt:not(.on) .etikett h2 { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skarm.oppen .falt:not(.on) .etikett p, .skarm.oppen .falt:not(.on) .etikett .nu { opacity: 0; height: 0; margin: 0; overflow: hidden; }
  .skarm.oppen .falt.on .etikett { left: 64px; right: auto; bottom: auto; top: 110px; }
  .skarm.oppen .falt.on .etikett h2 { font-size: clamp(56px, 6vw, 92px); }
  .skarm.oppen .falt.on .etikett p, .skarm.oppen .falt.on .etikett .nu { opacity: 0; height: 0; margin: 0; overflow: hidden; }

  /* ---------- panelen ---------- */
  .kort { position: absolute; top: 50%; right: 56px; width: 520px; max-height: calc(100vh - 80px); overflow-y: auto; scrollbar-width: none; transform: translate(40px, -50%); opacity: 0; pointer-events: none; z-index: 3; color: var(--white); transition: all 0.9s var(--ease) 0.25s; }
  .kort::-webkit-scrollbar { display: none; }
  .falt.on .kort { transform: translate(0, -50%); opacity: 1; pointer-events: auto; }
  .kort .lbl { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,0.7); margin: 0 0 10px; }
  .kort h3 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; }
  .kort .desc { margin: 6px 0 22px; font-size: 14px; color: rgba(255,255,255,0.78); line-height: 1.5; }

  .mallar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .mall { position: relative; border-radius: 10px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.22); cursor: pointer; background: #222; aspect-ratio: 16 / 9; transition: border-color 0.3s; }
  .mall img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease); }
  .mall:hover img { transform: scale(1.04); }
  .mall .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; font-size: 13px; font-weight: 600; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7)); display: flex; gap: 6px; align-items: center; }
  .mall .cap svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.3s; }
  .mall.on { border-color: var(--white); } .mall.on .cap svg { opacity: 1; }
  .mall .form { position: absolute; top: 8px; left: 8px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); }

  .toner { display: flex; gap: 8px; margin-bottom: 22px; }
  .ton { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(8px); }
  .ton i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .ton.on { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.7); }

  .fv { border-radius: 12px; overflow: hidden; background: #FAFAF6; color: var(--ink); box-shadow: 0 24px 60px -24px rgba(0,0,0,0.8); margin-bottom: 22px; }
  .fv .hero { position: relative; height: 150px; background: #C9C4B8; overflow: hidden; }
  .fv .hero img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.4s; }
  .fv .hero .av { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%; border: 3px solid #FAFAF6; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; }
  .fv .hero .av::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid #FAFAF6; }
  .fv .hero.form-fade img { -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent 100%); mask-image: linear-gradient(180deg, #000 45%, transparent 100%); }
  .fv .hero.form-u img { clip-path: path('M0 0H520V84C520 138 470 150 380 150H140C50 150 0 138 0 84Z'); }
  .fv .hero.form-bage img { clip-path: ellipse(70% 100% at 50% 0%); }
  .fv .hero.form-valv img { clip-path: path('M40 150V110A220 110 0 0 1 480 110V150Z'); }
  .fv .hero.form-vag img { clip-path: path('M0 0H520V118C480 136 440 136 390 122C340 108 300 108 260 122C220 136 180 136 130 122C80 108 40 108 0 122Z'); }
  .fv .hero.form-skold img { clip-path: path('M0 0H520V100C520 126 330 140 260 150C190 140 0 126 0 100Z'); }
  .fv .hero.form-kuvert img { clip-path: path('M0 0H520V104L260 150L0 104Z'); }
  .fv .hero.form-oval img { -webkit-mask-image: radial-gradient(ellipse 62% 90% at 50% 40%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 62% 90% at 50% 40%, #000 55%, transparent 100%); }
  .fv .hero.form-snett img { clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .fv .hero.form-kullar img { clip-path: path('M0 0H520V110C520 136 470 142 390 128C350 120 300 120 260 134C220 120 170 120 130 128C50 142 0 136 0 110Z'); }
  .fv .body { padding: 26px 20px 18px; }
  .fv .avs { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .fv .avs b { color: var(--ink); font-weight: 600; }
  .fv .hej { font-size: 14px; font-weight: 700; margin: 0 0 6px; }
  .fv .txt { font-size: 11.5px; line-height: 1.55; color: #3C3F45; margin: 0; }
  .fv .prod { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: #fff; }
  .fv .prod b { display: block; font-size: 12px; } .fv .prod .pris { font-weight: 700; }

  .test { display: flex; gap: 8px; margin-bottom: 16px; }
  .test input { flex: 1; padding: 11px 13px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 13.5px; backdrop-filter: blur(8px); }
  .test input::placeholder { color: rgba(255,255,255,0.55); }
  .btn { padding: 11px 15px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.3s; backdrop-filter: blur(8px); }
  .btn:hover { background: rgba(255,255,255,0.2); }
  .btn.prim { background: #fff; color: var(--ink); border-color: #fff; font-weight: 600; }
  .btn.prim:hover { background: #F1F2F4; }
  .actions { display: flex; gap: 8px; }

  .topp { position: fixed; top: 22px; left: 248px; right: 0; padding: 0 64px 0 28px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,0.85); font-size: 12.5px; z-index: 5; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }
  .topp b { color: #fff; font-weight: 600; }
  .rals { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
  .rals a { width: 26px; height: 22px; display: grid; place-items: center; text-decoration: none; }
  .rals a i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: all 0.4s var(--ease); }
  .rals a.on i { height: 20px; border-radius: 3px; background: #fff; }
  .hint { position: fixed; bottom: 22px; left: calc(248px + 50%); transform: translateX(-50%); color: rgba(255,255,255,0.75); font-size: 12px; display: flex; gap: 8px; align-items: center; z-index: 5; transition: opacity 0.6s; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .hint i { width: 18px; height: 28px; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 10px; position: relative; }
  .hint i::after { content: ""; position: absolute; left: 50%; top: 5px; width: 3px; height: 6px; margin-left: -1.5px; border-radius: 2px; background: #fff; animation: hjul 1.6s infinite; }
  @keyframes hjul { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }
  .hint.dold, .oppen-lage .hint { opacity: 0; }
  .klipp { margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 12px; font-size: 12.5px; color: rgba(255,255,255,0.75); }
  .klipp summary { cursor: pointer; font-weight: 600; color: rgba(255,255,255,0.9); list-style: none; display: flex; align-items: center; gap: 8px; }
  .klipp summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 0.3s; }
  .klipp[open] summary::before { transform: rotate(45deg); }
  .klipp p { margin: 10px 0; line-height: 1.5; } .klipp .status { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: rgba(255,255,255,0.6); word-break: break-all; }
  .kopiera { pointer-events: auto; font: inherit; font-size: 12px; font-weight: 500; color: #fff; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; padding: 5px 11px; cursor: pointer; backdrop-filter: blur(8px); }
  .kopiera:hover { background: rgba(255,255,255,0.26); }
  .toast { position: fixed; left: calc(248px + 50%); bottom: 28px; transform: translate(-50%, 20px); padding: 10px 16px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.4s var(--ease); z-index: 20; pointer-events: none; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) { body { grid-template-columns: 1fr; } aside { display: none; } .topp { left: 0; } .kort { right: 24px; width: min(520px, calc(100vw - 48px)); } .hint, .toast { left: 50%; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } main { scroll-behavior: auto; } }
</style>

const VARIANTER = ['uhd_2560_1440_30fps', 'uhd_2560_1440_25fps', 'uhd_2560_1440_24fps', 'hd_1920_1080_30fps', 'hd_1920_1080_25fps', 'hd_1920_1080_24fps', 'uhd_3840_2160_30fps', 'uhd_3840_2160_25fps', 'uhd_3840_2160_24fps', 'hd_1280_720_30fps', 'hd_1280_720_25fps', 'hd_1366_720_30fps', 'hd_1366_720_25fps', 'sd_960_540_30fps', 'sd_960_540_25fps'];
const U = (id, w = 1200, h = 1600) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&h=${h}&q=80`;
const formNamn = { fade: 'Fade', u: 'U-form', bage: 'Båge', valv: 'Valv', vag: 'Våg', skold: 'Sköld', kuvert: 'Kuvert', oval: 'Spotlight', snett: 'Snedsnitt', kullar: 'Kullar' };

const main = document.getElementById('main'), rals = document.getElementById('rals');
const state = { vald: null };

/* Provar en lista av mp4-adresser i tur och ordning; ger upp tyst om ingen fungerar. */
function laddaVideo(v, kallor, klar, misslyckades) {
  let i = 0;
  const prova = () => {
    if (i >= kallor.length) { misslyckades(); return; }
    v.src = kallor[i++];
    v.load();
  };
  v.addEventListener('error', prova);
  v.addEventListener('canplay', () => { v.removeEventListener('error', prova); klar(); }, { once: true });
  prova();
}

SKARMAR.forEach((rubrik, si) => {
  const skarm = document.createElement('section');
  skarm.className = 'skarm'; skarm.dataset.i = si;
  TEMAN.slice(si * 4, si * 4 + 4).forEach(t => {
    const f = document.createElement('article');
    f.className = 'falt'; f.id = t.id;
    f.innerHTML = `
      <img alt="" src="${t.poster || U(t.bild)}">
      <video muted loop playsinline preload="none"></video>
      <div class="etikett"><h2>${t.namn}</h2><p>${t.desc}</p><span class="nu"><i></i>Används nu</span></div>
      <div class="kort">
        <p class="lbl">Mall för alla medarbetare</p>
        <h3>${t.namn}</h3>
        <p class="desc">${t.desc} Det du väljer här går ut i varje svar från kundservice.</p>
        <p class="lbl">Bild i mejlet</p>
        <div class="mallar">${t.mallar.map((m, k) => `
          <div class="mall ${k === 0 ? 'on' : ''}" data-k="${k}"><img src="${U(m.bild, 640, 360)}" alt=""><span class="form">${formNamn[m.form]}</span>
            <div class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>${m.namn}</div></div>`).join('')}</div>
        <p class="lbl">Ton</p>
        <div class="toner">${t.toner.map((x, k) => `<span class="ton ${k === 0 ? 'on' : ''}" data-k="${k}"><i style="background:${x[1]}"></i>${x[0]}</span>`).join('')}</div>
        <p class="lbl">Så blir mejlet</p>
        <div class="fv">
          <div class="hero form-${t.mallar[0].form}"><img src="${U(t.mallar[0].bild, 1040, 300)}" alt=""><div class="av" style="background:${t.accent}">${t.butik[0]}</div></div>
          <div class="body">
            <div class="avs"><span><b>Ida Norén</b> &nbsp;${t.butik} kundservice</span><span>26 september · D-2216</span></div>
            <p class="hej" style="color:${t.accent}">Hej Sara,</p>
            <p class="txt">${t.svar}</p>
            <div class="prod"><span><b>${t.prod[0]}</b>${t.prod[1]}</span><span class="pris" style="color:${t.accent}">${t.prod[2]}</span></div>
          </div>
        </div>
        <p class="lbl">Prova i din egen inkorg</p>
        <div class="test"><input type="email" placeholder="namn@företag.se"><button class="btn" data-act="test">Skicka testmejl</button></div>
        <div class="actions"><button class="btn prim" data-act="valj">Använd för alla</button><button class="btn" data-act="stang">Stäng</button></div>
        <details class="klipp"><summary>Byt klipp för det här temat</summary>
          <p>Klistra in länken till ett Pexels-klipp, eller en direkt mp4-länk, och tryck Prova. Fältet laddar om direkt. När du är nöjd med alla, tryck "Kopiera klipplista" uppe till höger och skicka listan till mig.</p>
          <div class="test"><input type="text" data-klipp placeholder="https://www.pexels.com/video/…-1234567/"><button class="btn" data-act="prova">Prova</button></div>
          <p class="status" data-status>Nu: ${t.video ? t.video : 'Pexels ' + t.pexels.join(', ')}</p>
        </details>
      </div>`;
    skarm.appendChild(f);

    const img = f.querySelector('img'), v = f.querySelector('video');
    img.addEventListener('load', () => img.classList.add('ready', 'drift'));
    if (img.complete && img.naturalWidth) img.classList.add('ready', 'drift');
    const kallor = t.video ? [t.video] : t.pexels.flatMap(p => VARIANTER.map(x => `https://videos.pexels.com/video-files/${p}/${p}-${x}.mp4`));
    f._video = v; f._kallor = kallor; f._laddad = false;
    f._ladda = () => {
      if (f._laddad) return; f._laddad = true;
      laddaVideo(v, kallor, () => { v.classList.add('ready'); img.classList.remove('drift'); if (skarm.classList.contains('on')) v.play().catch(() => {}); }, () => v.remove());
    };

    /* öppna fältet */
    f.addEventListener('click', e => {
      if (e.target.closest('.kort')) return;
      if (f.classList.contains('on')) return;
      skarm.querySelectorAll('.falt').forEach(x => x.classList.remove('on'));
      f.classList.add('on'); skarm.classList.add('oppen'); document.body.classList.add('oppen-lage');
    });
    f.querySelectorAll('.mall').forEach(el => el.addEventListener('click', () => {
      const k = +el.dataset.k; f.querySelectorAll('.mall').forEach(x => x.classList.toggle('on', x === el));
      const hero = f.querySelector('.fv .hero'), hi = hero.querySelector('img');
      hero.className = 'hero form-' + t.mallar[k].form;
      hi.style.opacity = 0; setTimeout(() => { hi.src = U(t.mallar[k].bild, 1040, 300); hi.onload = () => hi.style.opacity = 1; }, 200);
    }));
    f.querySelectorAll('.ton').forEach(el => el.addEventListener('click', () => {
      const k = +el.dataset.k; f.querySelectorAll('.ton').forEach(x => x.classList.toggle('on', x === el));
      const c = t.toner[k][1]; f.querySelector('.fv .hej').style.color = c; f.querySelector('.fv .pris').style.color = c; f.querySelector('.fv .av').style.background = c;
    }));
    f.querySelector('[data-act="valj"]').addEventListener('click', () => {
      state.vald = t.id; document.querySelectorAll('.falt').forEach(x => x.classList.toggle('vald', x.id === t.id));
      toast(`${t.namn} används nu för alla medarbetare`);
    });
    f.querySelector('[data-act="test"]').addEventListener('click', () => {
      const inp = f.querySelector('input'); if (!inp.value || !inp.validity.valid) { inp.focus(); return; }
      toast(`Testmejl med ${t.namn} skickas till ${inp.value}`);
    });
    f.querySelector('[data-act="prova"]').addEventListener('click', () => {
      const inp = f.querySelector('[data-klipp]'), val = inp.value.trim(); if (!val) { inp.focus(); return; }
      let kallor;
      if (/\.mp4(\?|$)/i.test(val)) { t.video = val; t.pexels = []; kallor = [val]; }
      else { const m = val.match(/(\d{5,9})/); if (!m) { toast('Hittade inget klipp-id i länken'); return; } t.video = null; t.pexels = [+m[1]]; kallor = VARIANTER.map(x => `https://videos.pexels.com/video-files/${m[1]}/${m[1]}-${x}.mp4`); }
      let v = f.querySelector('video');
      if (!v) { v = document.createElement('video'); v.muted = true; v.loop = true; v.playsInline = true; f.insertBefore(v, f.querySelector('.etikett')); f._video = v; }
      v.classList.remove('ready'); img.classList.add('drift');
      f.querySelector('[data-status]').textContent = 'Provar…';
      laddaVideo(v, kallor, () => { v.classList.add('ready'); img.classList.remove('drift'); v.play().catch(() => {}); f.querySelector('[data-status]').textContent = 'Nu: ' + (t.video || 'Pexels ' + t.pexels[0]) + ' · fungerar'; },
        () => { f.querySelector('[data-status]').textContent = 'Kunde inte ladda något klipp från den länken.'; });
    });
    f.querySelector('[data-act="stang"]').addEventListener('click', () => { f.classList.remove('on'); skarm.classList.remove('oppen'); document.body.classList.remove('oppen-lage'); });
  });
  main.appendChild(skarm);
  const a = document.createElement('a'); a.href = '#'; a.innerHTML = '<i></i>'; a.title = rubrik;
  a.addEventListener('click', e => { e.preventDefault(); skarm.scrollIntoView({ behavior: 'smooth' }); });
  rals.appendChild(a);
});

/* aktiv skärm: ladda och spela dess fyra klipp, förbered nästa skärm, pausa resten */
const skarmar = [...document.querySelectorAll('.skarm')];
let aktiv = -1;
function aktivera(i) {
  if (i === aktiv) return; aktiv = i;
  skarmar.forEach((s, k) => {
    s.classList.toggle('on', k === i);
    if (k !== i) { s.classList.remove('oppen'); s.querySelectorAll('.falt').forEach(f => f.classList.remove('on')); document.body.classList.remove('oppen-lage'); }
    s.querySelectorAll('.falt').forEach(f => {
      if (k === i || k === i + 1) f._ladda();
      const v = f._video; if (!v || !v.isConnected) return;
      if (k === i) v.play().catch(() => {}); else v.pause();
    });
  });
  rals.querySelectorAll('a').forEach((a, k) => a.classList.toggle('on', k === i));
  document.getElementById('topp-namn').textContent = SKARMAR[i];
  document.getElementById('topp-nr').textContent = i + 1;
  document.getElementById('hint').classList.toggle('dold', i > 0);
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) aktivera(+e.target.dataset.i); }), { root: main, threshold: 0.6 });
skarmar.forEach(s => io.observe(s));
aktivera(0);

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const s = skarmar[aktiv]; s.classList.remove('oppen'); s.querySelectorAll('.falt').forEach(f => f.classList.remove('on')); document.body.classList.remove('oppen-lage'); }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); skarmar[Math.min(aktiv + 1, 2)].scrollIntoView({ behavior: 'smooth' }); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); skarmar[Math.max(aktiv - 1, 0)].scrollIntoView({ behavior: 'smooth' }); }
});
document.getElementById('kopiera').addEventListener('click', () => {
  const lista = TEMAN.map(t => `${t.namn}: ${t.video || 'Pexels ' + t.pexels.join(', ')}`).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(lista) : Promise.reject()).then(() => toast('Klipplistan är kopierad'), () => { console.log(lista); toast('Kunde inte kopiera, listan ligger i konsolen'); });
});
let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
</script>
